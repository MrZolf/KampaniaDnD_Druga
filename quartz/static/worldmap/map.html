<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/leaflet-measure/dist/leaflet-measure.css"/>

    <style>
        html, body {
            margin:0;
            height:100%;
        }

        #map {
            width:100%;
            height:100vh;
            background:#111;
        }

        .leaflet-popup-content {
            text-align:center;
        }

        .wiki-link {
            display:inline-block;
            padding:6px 12px;
            background:#444;
            color:white;
            text-decoration:none;
            border-radius:6px;
        }

        .wiki-link:hover {
            background:#666;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/leaflet-measure/dist/leaflet-measure.min.js"></script>

<script src="map.js"></script>

</body>
</html>
